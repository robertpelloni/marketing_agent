name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false


    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install dependencies
      run: go mod download

    - name: Verify Version Consistency
      run: |
        V1=$(cat VERSION)
        V2=$(cat VERSION.md)
        if [ "$V1" != "$V2" ]; then
          echo "Version mismatch: VERSION($V1) != VERSION.md($V2)"
          exit 1
        fi

    - name: Run Integrity Tests
      run: go test ./internal/gitcheck/...

    - name: Run Conflict Resolution Tests
      run: go test ./internal/gitres/...

    - name: Run All Project Tests
      run: go test ./...

    - name: Build
      run: go build -v ./cmd/marketing_agent

    - name: Verify Staging Health Check Script
      run: |
        test -x scripts/staging_health_check.sh
        bash -n scripts/staging_health_check.sh

    - name: Docker Compose Smoke Test
      run: |
        test -x scripts/docker_smoke_test.sh
        bash -n scripts/docker_smoke_test.sh
        ./scripts/docker_smoke_test.sh

    - name: Validate Prometheus Alert Rules
      run: |
        python3 -c "
        with open('deploy/prometheus-rules.yml') as f:
            content = f.read()
        assert 'groups:' in content
        assert 'marketing_agent_alerts' in content
        assert 'DatabasePoolExhausted' in content
        print('Prometheus rules validated successfully')
        "
